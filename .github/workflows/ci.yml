name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Smoke-test CLI against vulnerable example
        run: |
          # Exit code 1 is expected: the example server is deliberately vulnerable.
          mcp-audit scan -- python examples/vuln_prompt_injection_server.py || code=$?
          if [ "${code:-0}" != "1" ]; then
            echo "expected exit code 1 from vulnerable example; got ${code:-0}"
            exit 1
          fi

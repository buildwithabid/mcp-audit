[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-audit"
version = "0.1.1"
description = "Security scanner for Model Context Protocol (MCP) servers — find prompt injection, over-broad permissions, weak input validation, and credential leaks before your agent does."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Abid Ali" }]
requires-python = ">=3.11"
keywords = [
    "mcp",
    "model-context-protocol",
    "mcp-server",
    "mcp-security",
    "mcp-scanner",
    "mcp-audit",
    "security",
    "scanner",
    "static-analysis",
    "audit",
    "ai",
    "ai-security",
    "agent",
    "agent-security",
    "llm",
    "llm-security",
    "prompt-injection",
    "tool-poisoning",
    "anthropic",
    "claude",
    "openai",
    "supply-chain",
    "owasp",
    "cli",
    "pytest",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.0.0",
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/BuildWithAbid/mcp-audit"
Issues = "https://github.com/BuildWithAbid/mcp-audit/issues"
Source = "https://github.com/BuildWithAbid/mcp-audit"
Documentation = "https://github.com/BuildWithAbid/mcp-audit#readme"
Changelog = "https://github.com/BuildWithAbid/mcp-audit/releases"
"Sister project (TypeScript)" = "https://github.com/BuildWithAbid/mcp-shield"

[project.scripts]
mcp-audit = "mcp_audit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
